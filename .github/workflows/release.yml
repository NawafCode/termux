name: Build and Publish Signed APKs

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        package_variant: [ apt-android-7, apt-android-5 ]
    env:
      BUILD_TOOLS_VERSION: '36.0.0'
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      TERMUX_PACKAGE_VARIANT: ${{ matrix.package_variant }}
      TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS: '1'

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Check signing configuration
        env:
          TERMUX_RELEASE_KEYSTORE_BASE64: ${{ secrets.TERMUX_RELEASE_KEYSTORE_BASE64 }}
          TERMUX_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.TERMUX_RELEASE_KEYSTORE_PASSWORD }}
          TERMUX_RELEASE_KEY_ALIAS: ${{ secrets.TERMUX_RELEASE_KEY_ALIAS }}
        run: |
          for secret in TERMUX_RELEASE_KEYSTORE_BASE64 TERMUX_RELEASE_KEYSTORE_PASSWORD TERMUX_RELEASE_KEY_ALIAS; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Missing Actions secret $secret. See docs/github-actions.md."
              exit 1
            fi
          done

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install signing tools
        run: sdkmanager "build-tools;$BUILD_TOOLS_VERSION"

      - name: Set build version
        run: |
          version_tag="${RELEASE_TAG:-${GITHUB_SHA:0:7}}"
          {
            echo "TERMUX_APP_VERSION_NAME=${RELEASE_TAG#v}"
            echo "TERMUX_APK_VERSION_TAG=$version_tag-$TERMUX_PACKAGE_VARIANT-release"
          } >> "$GITHUB_ENV"

      - name: Build release APKs
        run: ./gradlew :app:assembleRelease --console=plain --stacktrace

      - name: Sign and verify APKs
        env:
          TERMUX_RELEASE_KEYSTORE_BASE64: ${{ secrets.TERMUX_RELEASE_KEYSTORE_BASE64 }}
          TERMUX_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.TERMUX_RELEASE_KEYSTORE_PASSWORD }}
          TERMUX_RELEASE_KEY_ALIAS: ${{ secrets.TERMUX_RELEASE_KEY_ALIAS }}
        run: |
          umask 077
          signing_dir="$(mktemp -d "$RUNNER_TEMP/termux-signing.XXXXXX")"
          trap 'rm -rf "$signing_dir"' EXIT
          export TERMUX_RELEASE_KEYSTORE_FILE="$signing_dir/release.p12"
          printf '%s' "$TERMUX_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$TERMUX_RELEASE_KEYSTORE_FILE"
          bash .github/scripts/sign-apks.sh app/build/outputs/apk/release "$RUNNER_TEMP/signed-apks"

      - name: Save signed APKs
        uses: actions/upload-artifact@v6
        with:
          name: signed-${{ matrix.package_variant }}
          path: ${{ runner.temp }}/signed-apks/*
          if-no-files-found: error

      - name: Attach signed APKs to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/signed-apks/* --repo "$GITHUB_REPOSITORY" --clobber
