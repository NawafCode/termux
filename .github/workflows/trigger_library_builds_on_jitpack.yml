name: Trigger Termux Library Builds on Jitpack

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag or commit to build (defaults to the selected branch commit)'
        type: string
        required: false

permissions:
  contents: read

jobs:
  trigger-termux-library-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TERMUX_LIB_VERSION: ${{ github.event.release.tag_name || inputs.version || github.sha }}
    steps:
      - name: Trigger termux library builds on jitpack
        run: |
          version="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["TERMUX_LIB_VERSION"], safe=""))')"
          for module in terminal-emulator terminal-view termux-shared; do
            url="https://jitpack.io/com/github/$GITHUB_REPOSITORY/$module/$version/$module-$version.pom"
            echo "Building $GITHUB_REPOSITORY / $module at $TERMUX_LIB_VERSION"
            curl --fail --location --show-error --silent \
              --connect-timeout 30 --max-time 600 \
              --retry 2 --retry-delay 15 --retry-all-errors \
              --output "$RUNNER_TEMP/$module.pom" "$url"
          done
